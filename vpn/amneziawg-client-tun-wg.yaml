apiVersion: v1
kind: Secret
metadata:
  name: wg-mt-keys
  namespace: vpn
type: Opaque
stringData:
  server_privatekey: "OG2pBPE0igFpMYJ0pIyLJNepv3vFTwHcNmplSidNN2I="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amneziawg-client
  namespace: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amneziawg-client
  template:
    metadata:
      labels:
        app: amneziawg-client
    spec:
      containers:
        - name: awg
          image: isonecom/amneziawg-client:latest
          securityContext:
            privileged: true
            capabilities: { add: ["NET_ADMIN","SYS_ADMIN"] }
          volumeMounts:
            - { name: wg-config,  mountPath: /config }
            - { name: wg-mt-keys, mountPath: /run/wg-mt, readOnly: true }
            - { name: dev-net-tun, mountPath: /dev/net/tun }
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sysctl -w net.ipv4.conf.all.src_valid_mark=1 || true
              sysctl -w net.ipv4.ip_forward=1 || true

              # 1) основной выход в интернет — AmneziaWG
              awg-quick down wg0 2>/dev/null|| true
              awg-quick up /config/wg0.conf

              # жёстко режем MTU на wg0 для стабильности через overlay / VIP
              ip link set dev wg0 mtu 1280 || true
              
              # 2) WireGuard-сервер для MikroTik (wg-mt)
              mkdir -p /etc/wireguard
              SKEY="$(cat /run/wg-mt/server_privatekey)"
              PKEY="$(printf '%s' "$SKEY" | wg pubkey)"
              echo "$PKEY" | tee /run/wg-mt.pub >/dev/null

              cat >/etc/wireguard/wg-mt.conf <<EOF
              [Interface]
              PrivateKey = $SKEY
              Address = 192.168.99.14/30
              ListenPort = 51822
              MTU = 1280

              # основной пир - MikroTik
              [Peer]
              # MikroTik public key
              PublicKey = WdIRKFRvGAyEkO3P8LA0hG9/EeecpOGITX9++pBhMTo=
              # адрес MikroTik внутри тоннеля
              AllowedIPs = 0.0.0.0/0
              PersistentKeepalive = 25
              EOF

              wg-quick down wg-mt 2>/dev/null|| true
              wg-quick up /etc/wireguard/wg-mt.conf

              # на всякий случай принудительно выставим MTU на интерфейсе wg-mt тоже
              ip link set dev wg-mt mtu 1280 || true

              echo "[iptables] allow forward wg-mt <-> wg0 and NAT out via wg0"
              # Разрешаем клиентам с MikroTik уходить в wg0
              iptables -C FORWARD -i wg-mt -o wg0 -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i wg-mt -o wg0 -j ACCEPT

              # Разрешаем обратный трафик из wg0 к MikroTik
              iptables -C FORWARD -i wg0 -o wg-mt -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
                iptables -A FORWARD -i wg0 -o wg-mt -m state --state RELATED,ESTABLISHED -j ACCEPT

              # NAT: MikroTik (192.168.99.13) -> в AmneziaWG (wg0)
              iptables -t nat -C POSTROUTING -s 192.168.99.13/32 -o wg0 -j MASQUERADE 2>/dev/null || \
              iptables -t nat -A POSTROUTING -s 192.168.99.13/32 -o wg0 -j MASQUERADE

              echo "[status dump]"
              echo "WG-MT server public key: $PKEY"
              echo "--- ip -br a ---"
              ip -br a
              echo "--- wg show ---"
              wg show
              echo "--- routes ---"
              ip route
              echo "--- iptables FORWARD ---"
              iptables -L FORWARD -n -v
              echo "--- iptables NAT ---"
              iptables -t nat -L POSTROUTING -n -v

              tail -f /dev/null
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","ip link show wg0 >/dev/null 2>&1 && ip link show wg-mt >/dev/null 2>&1"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: wg-config
          secret:
            secretName: amneziawg-config
            items: [{ key: wg0.conf, path: wg0.conf }]
        - name: wg-mt-keys
          secret: { secretName: wg-mt-keys }
        - name: dev-net-tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
---
apiVersion: v1
kind: Service
metadata:
  name: wg-mt
  namespace: vpn
spec:
  type: LoadBalancer
  loadBalancerIP: 172.20.0.85
  selector:
    app: amneziawg-client
  ports:
    - name: wg-udp
      protocol: UDP
      port: 51822
      targetPort: 51822
